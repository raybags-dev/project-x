services:
  app:
    build: .
    container_name: reviewer-x
    restart: unless-stopped
    ports:
      - "3002:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      - MY_SECRET=${MY_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - SECRET_ADMIN_TOKEN=${SECRET_ADMIN_TOKEN}
      - SUPER_USER_TOKEN=${SUPER_USER_TOKEN}
      - PROXY_ENDPOINT=${PROXY_ENDPOINT}
      - WEBSHARE_API_TOKEN=${WEBSHARE_API_TOKEN}
      - AUTH_ENCRYPTION_KEY=${AUTH_ENCRYPTION_KEY}
    volumes:
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=reviewer-x
    command: ["--quiet", "--logpath", "/dev/null"]

volumes:
  mongo-data:
    name: reviewer-x-mongo-data
