  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=reviewer-x
    command: ["--quiet", "--logpath", "/dev/null"]
    networks:
      - app-network

volumes:
  mongo-data:
    name: reviewer-x-mongo-data

networks:
  app-network:
    driver: bridge
